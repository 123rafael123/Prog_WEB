<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3 seleccion con querySelector</title>
</head>
<body>
    <input type="text" id="elemento" value="valor inicial">
    <script>
        const inputElemento=document.querySelector('input[type="text"]')
        inputElemento.value='Rafael'
    </script>
</body>
</html>
